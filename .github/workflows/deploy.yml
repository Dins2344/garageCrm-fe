name: Deploy GarageFlow Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build & Push to Docker Hub ──
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/garageflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/garageflow-frontend:${{ github.sha }}

  # ── Deploy to EC2 ──
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.1
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/garageflow-frontend
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: DH_USER,DH_TOKEN,FE_IMAGE
          script: |
            set -e

            echo "Logging into Docker Hub..."
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

            echo "Pulling latest frontend image..."
            docker pull "${FE_IMAGE}:latest"

            echo "Stopping old frontend container..."
            docker stop garageflow-frontend 2>/dev/null || true
            docker rm garageflow-frontend 2>/dev/null || true

            echo "Starting frontend container..."
            docker run -d \
              --name garageflow-frontend \
              --restart unless-stopped \
              -p 3000:80 \
              "${FE_IMAGE}:latest"

            echo "⏳ Waiting for startup..."
            sleep 5

            echo "Checking health..."
            curl -sf http://localhost:3000/ > /dev/null || (echo "Frontend health check failed!" && docker logs garageflow-frontend && exit 1)

            echo "Cleaning up..."
            docker image prune -f

            echo "Frontend deployment complete!"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Frontend deployed for commit ${{ github.sha }}"
          else
            echo "Frontend deployment failed for commit ${{ github.sha }}"
          fi

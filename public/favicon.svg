<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- G letter (left side, bold white) -->
  <text x="7" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="white" opacity="0.95">G</text>

  <!-- P letter (right side, cyan accent) -->
  <text x="34" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#06b6d4" opacity="0.95">P</text>

  <!-- Pulse / EKG wave line across middle -->
  <g filter="url(#glow)">
    <polyline
      points="4,36 10,36 13,28 16,44 19,22 22,44 25,36 36,36 39,28 42,44 45,22 48,44 51,36 60,36"
      fill="none"
      stroke="url(#pulseGrad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  </g>

  <!-- Bottom highlight line -->
  <rect x="12" y="56" width="40" height="2" rx="1" fill="#06b6d4" opacity="0.4"/>
</svg>